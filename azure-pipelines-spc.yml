# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- prod-spc

pool:
  vmImage: ubuntu-latest

steps:
- script: |
    echo $(GitHubPAT) | docker login ghcr.io -u $(GitHubUsername) --password-stdin
    docker pull ghcr.io/$(GitHubUsername)/ktbl-spc:prod
    docker tag ghcr.io/$(GitHubUsername)/ktbl-spc:prod cat-docker.artifacts.cat.com/chinaqdts/ktbl-spc:prod
  displayName: 'Login and pull docker from GitHub'

- task: wiz@1
  inputs:
    serviceConnectionId: 'wiz-qdts'
    command: 'scan'
    scanType: 'containerimage'
    image: 'ghcr.io/$(GitHubUsername)/ktbl-spc:prod'
    byPolicyHits: DISABLED
- task: JFrogDocker@1
  inputs:
   command: 'Push'
   artifactoryConnection: 'QDTS_Artifactory_P'
   imageName: 'cat-docker.artifacts.cat.com/chinaqdts/ktbl-spc:prod'
   threads: '3'
   skipLogin: false
