# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- script: |
    echo $(GitHubPAT) | docker login ghcr.io -u $(GitHubUsername) --password-stdin
    docker pull ghcr.io/$(GitHubUsername)/nacos-server:3.2.3
  displayName: 'Login and pull docker from GitHub'

- task: wiz@1
  inputs:
    serviceConnectionId: 'wiz-qdts'
    command: 'scan'
    scanType: 'containerimage'
    image: 'ghcr.io/$(GitHubUsername)/nacos-server:3.2.3'
    byPolicyHits: DISABLED
- task: JFrogDocker@1
  inputs:
    command: 'Push'
    artifactoryConnection: 'QDTS_Artifactory_V2'
    imageName: 'cat-docker.artifacts.cat.com/chinaqdts/nacos-server:3.2.3'
    threads: '3'
    skipLogin: false