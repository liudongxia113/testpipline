trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
#- script: echo Hello, world!
#  displayName: 'Run a one-line script'

#- script: |
#    echo Add other tasks to build, test, and deploy your project.
#    echo See https://aka.ms/yaml
#  displayName: 'Run a multi-line script'

- script: |
    echo $(GitHubPAT) | docker login ghcr.io -u $(GitHubUsername) --password-stdin
    docker pull ghcr.io/$(GitHubUsername)/agilebuilder-v10:latest
  displayName: 'Login and pull docker from GitHub'


#- script: |
#    docker pull ghcr.io/$(GitHubUsername)/agilebuilder-v10:latest
#  displayName: 'Docker Pull GitHub Container Registry'
  
- task: wiz@1
  inputs:
    serviceConnectionId: 'wiz-qdts'
    command: 'scan'
    scanType: 'containerimage'
    image: 'ghcr.io/$(GitHubUsername)/agilebuilder-v10:latest'
    byPolicyHits: DISABLED
